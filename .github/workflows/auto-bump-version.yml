name: Auto Bump Version

on:
  push:
    branches:
      - wzv3
    paths-ignore:
      - "bot/version.py"

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture triggering commit author
        run: |
          echo "GIT_AUTHOR_NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "GIT_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV

      - name: Bump patch version
        shell: python
        run: |
          from pathlib import Path
          import re

          version_file = Path("bot/version.py")
          text = version_file.read_text(encoding="utf-8")

          major = re.search(r'MAJOR\s*=\s*"(\d+)"', text)
          minor = re.search(r'MINOR\s*=\s*"(\d+)"', text)
          patch = re.search(r'PATCH\s*=\s*"(\d+)"', text)

          if not (major and minor and patch):
              raise SystemExit("Could not find MAJOR/MINOR/PATCH in bot/version.py")

          current = f"{major.group(1)}.{minor.group(1)}.{patch.group(1)}"
          current_major = int(major.group(1))
          current_minor = int(minor.group(1))
          current_patch = int(patch.group(1))

          next_major = current_major
          next_minor = current_minor
          next_patch = current_patch + 1
          if next_patch > 9:
              next_patch = 0
              next_minor += 1

          next_version = f"{next_major}.{next_minor}.{next_patch}"

          text = re.sub(r'MAJOR\s*=\s*"\d+"', f'MAJOR = "{next_major}"', text, count=1)
          text = re.sub(r'MINOR\s*=\s*"\d+"', f'MINOR = "{next_minor}"', text, count=1)
          text = re.sub(r'PATCH\s*=\s*"\d+"', f'PATCH = "{next_patch}"', text, count=1)
          version_file.write_text(text, encoding="utf-8")

          with open("GITHUB_ENV", "a", encoding="utf-8") as env:
              env.write(f"CURRENT_VERSION={current}\n")
              env.write(f"NEXT_VERSION={next_version}\n")

      - name: Commit bumped version
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add bot/version.py
          git commit -m "chore: bump version to v${NEXT_VERSION}-x [skip changelog]" || exit 0
          git push
